<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>寶嚴閱藏 · 單一來源庫</title>
<style>
  :root{
    --ink:#241a10; --ink2:#5b4a36; --paper:#f7f2e8; --card:#fffefa;
    --gold:#8a5a06; --gold2:#7a4f05; --line:#ddcfb4; --accent:#7a1f1f;
    --chip:#efe6d2; --on:#8a5a06; --shadow:0 2px 6px rgba(80,60,20,.14);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    font-size:19px;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}
  header{text-align:center;padding:18px 14px 12px;border-bottom:3px solid var(--gold)}
  h1{margin:0;font-size:30px;letter-spacing:2px;color:var(--ink)}
  .tag{margin:6px 0 0;font-size:16px;color:var(--ink2)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:14px;margin:16px 0}
  /* search */
  .searchrow{display:flex;gap:8px}
  #q{flex:1;min-width:0;padding:14px 14px;font-size:19px;border:2px solid var(--line);
    border-radius:12px;background:#fff;font-family:inherit}
  .primary{padding:0 18px;font-size:20px;font-weight:700;color:#fff;background:var(--gold);
    border:none;border-radius:12px;cursor:pointer;min-height:54px;white-space:nowrap}
  .primary:active{background:var(--gold2)}
  /* segmented speaker */
  .seg{display:flex;gap:8px;margin-top:12px}
  .seg button{flex:1;min-height:56px;font-size:19px;font-weight:700;border:2px solid var(--gold);
    background:#fff;color:var(--gold);border-radius:12px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--gold);color:#fff}
  /* topics */
  .lbl{font-size:17px;color:var(--ink2);margin:16px 2px 8px;font-weight:700}
  .topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .topic{min-height:62px;padding:10px 12px;font-size:18px;font-weight:700;
    background:#fbf4e2;border:2px solid var(--line);border-radius:12px;cursor:pointer;
    color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:center;font-family:inherit}
  .topic .n{font-size:14px;font-weight:500;color:var(--gold2)}
  .topic.on{background:var(--gold);color:#fff;border-color:var(--gold)}
  .topic.on .n{color:#ffe9bf}
  .ghost{display:block;width:100%;margin-top:10px;min-height:50px;font-size:17px;
    background:#fff;border:2px solid var(--line);border-radius:12px;color:var(--gold);cursor:pointer;font-family:inherit}
  .alltopics{max-height:46vh;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .alltopics a{display:flex;justify-content:space-between;gap:8px;padding:13px 14px;font-size:17px;
    color:var(--ink);text-decoration:none;border-bottom:1px solid #f0e9d8;cursor:pointer}
  .alltopics a:active{background:#f3ead4}
  .alltopics .n{color:var(--gold2)}
  /* advanced (tucked away) */
  .advlink{display:inline-block;margin-top:14px;font-size:15px;color:var(--ink2);
    text-decoration:underline;cursor:pointer}
  #advPanel{margin-top:10px;display:none}
  .adv-hint{font-size:14px;color:var(--ink2);margin-bottom:8px}
  .adv-hint code{background:var(--chip);padding:1px 5px;border-radius:4px}
  .chk{display:flex;align-items:flex-start;gap:8px;font-size:15px;color:var(--ink2);cursor:pointer;line-height:1.4}
  .chk input{width:20px;height:20px;flex:none;margin-top:2px}
  .adv-grid{display:grid;grid-template-columns:1fr;gap:10px}
  .adv-grid label{display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--ink2)}
  .adv-grid input,.adv-grid select{padding:11px;font-size:17px;border:2px solid var(--line);border-radius:10px;background:#fff;font-family:inherit}
  .adv-grid .rng{display:flex;align-items:center;gap:8px}
  .adv-grid .rng input{width:100%}
  /* status + results */
  .status{font-size:16px;color:var(--ink2);margin:18px 2px 10px;font-weight:700}
  .chosen{display:inline-block;background:var(--gold);color:#fff;border:none;border-radius:20px;
    padding:6px 14px;font-size:16px;margin:0 0 12px;cursor:pointer;font-family:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);
    border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card .title{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
  .chip{font-size:14px;background:var(--chip);color:var(--ink2);padding:3px 11px;border-radius:14px}
  .chip.jh{background:#e2efd9;color:#33521f}
  .chip.cc{background:#dde7f2;color:#22405e}
  .chip.sc{background:#f3e0e0;color:var(--accent)}
  .info{font-size:16px;color:var(--ink2);margin-bottom:12px}
  .watch{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#fff;
    font-size:20px;font-weight:700;padding:14px;border-radius:12px}
  .watch:active{opacity:.85}
  .empty{text-align:center;color:var(--ink2);padding:30px 10px;font-size:18px}
  .pager{display:flex;gap:10px;margin:6px 0 4px}
  .pager button{flex:1;min-height:56px;font-size:19px;font-weight:700;background:#fff;
    border:2px solid var(--gold);color:var(--gold);border-radius:12px;cursor:pointer;font-family:inherit}
  .pager button:disabled{opacity:.4;border-color:var(--line);color:var(--ink2)}
  .totop{margin-top:6px}
  .prov{font-size:13px;color:var(--ink2);border-top:1px dashed var(--line);margin-top:22px;padding-top:12px;text-align:center}
  @media(min-width:560px){ .topics{grid-template-columns:1fr 1fr 1fr} }
  /* desktop: stay big, use the width — wider column + two-column results */
  @media(min-width:900px){
    body{font-size:20px}
    .wrap{max-width:1000px;padding:0 20px 50px}
    h1{font-size:36px}
    #results{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
    #results .card{margin-bottom:0}
    .adv-grid{grid-template-columns:1fr 1fr}
    .pager button{min-height:60px;font-size:20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>寶嚴閱藏</h1>
    <p class="tag">見輝法師 · 傳塵和尚　開示影片　隨點隨看</p>
  </header>

  <div class="panel">
    <div class="searchrow">
      <input id="q" type="text" placeholder="想找什麼？例如：楞嚴、念佛">
      <button id="goBtn" class="primary">搜尋</button>
    </div>

    <div class="seg" id="spk">
      <button data-spk="" class="on">全部</button>
      <button data-spk="jh">見輝法師</button>
      <button data-spk="cc">傳塵和尚</button>
    </div>

    <div class="lbl">主題（點一下就看）</div>
    <div class="topics" id="topics"></div>
    <button class="ghost" id="moreTopics">看全部主題 ▾</button>
    <div class="alltopics" id="allTopics" style="display:none"></div>

    <button class="ghost" id="advToggle">🔍 進階搜尋（精確篩選）</button>
    <div id="advPanel">
      <div class="adv-hint">關鍵字：空白＝都要　｜　<code>"片語"</code>＝精確　｜　<code>-詞</code>＝排除</div>
      <label class="chk" style="margin:2px 0 10px"><input type="checkbox" id="showdup"> 顯示重複上傳的影片（預設已自動合併，同一場只顯示一次）</label>
      <div class="adv-grid">
        <label>關鍵字範圍<select id="field"><option value="all">全部欄位</option><option value="title">僅標題</option><option value="scripture">僅經文《》</option><option value="series">僅系列</option><option value="speaker">僅主講者</option></select></label>
        <label>經文／典籍<input type="text" id="scripture" placeholder="如 楞嚴經、華嚴、金剛經"></label>
        <label>版本<select id="version"><option value="">不限</option><option>字幕版</option><option>逐字精研版</option><option>完整版</option><option>讀誦版</option></select></label>
        <label>時長（分鐘）<span class="rng"><input type="number" id="durMin" min="0" placeholder="最短"> – <input type="number" id="durMax" min="0" placeholder="最長"></span></label>
        <label>上架日期<span class="rng"><input type="date" id="dateFrom"> – <input type="date" id="dateTo"></span></label>
        <label>集號（搭配系列）<span class="rng"><input type="number" id="epMin" min="0" placeholder="起"> – <input type="number" id="epMax" min="0" placeholder="迄"></span></label>
        <label>排序<select id="sort"><option value="smart">預設（最新在前）</option><option value="date_desc">由新到舊</option><option value="relevance">最相關</option><option value="episode">依集號</option><option value="duration">由長到短</option><option value="date">由舊到新</option></select></label>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div id="chosenWrap"></div>
  <div id="results"></div>
  <div class="pager" id="pager"></div>
  <button class="ghost totop" id="toTop" style="display:none">回到最上面 ↑</button>
  <div class="prov" id="prov"></div>
</div>

<script>
const PROV = "唯一來源：見輝法師閱藏居／寶嚴國際佛學研修院（YouTube）。本站只收這兩個頻道的影片官方資料，非語音轉錄；點影片即連到 YouTube 觀看。";
const ROWS = JSON.parse(document.getElementById('DATA').textContent);
ROWS.forEach(r => { r._hay = [(r.title||''),(r.series||''),(r.speaker||''),(r.episode||''),((r.scriptures||[]).join(' ')),(r.source_channel||'')].join(' ').toLowerCase(); });
const $ = s => document.querySelector(s);
let state = {offset:0, limit:20, series:"", speaker:""};

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(d){return (d&&/^\d{8}$/.test(d))?d.slice(0,4)+"年"+d.slice(4,6)+"月"+d.slice(6,8)+"日":"";}
function negDate(d){d=d||"";let o="";for(const c of d)o+=(c>='0'&&c<='9')?String.fromCharCode(57-(c.charCodeAt(0)-48)):c;return o;}
function num(v){v=(v==null?"":v).toString().trim(); if(v==="")return null; const n=parseInt(v,10); return isNaN(n)?null:n;}
function digits(v){return (v==null?"":v).toString().replace(/\D/g,"").slice(0,8);}
function parseQuery(q){
  const toks=(q||"").match(/"[^"]+"|\S+/g)||[]; const pos=[],neg=[];
  for(const t of toks){
    if(t.length>=2 && t[0]==='"' && t[t.length-1]==='"'){const s=t.slice(1,-1).trim().toLowerCase(); if(s)pos.push(s);}
    else if(t.length>1 && (t[0]==='-'||t[0]==='－')){const s=t.slice(1).trim().toLowerCase(); if(s)neg.push(s);}
    else{const s=t.trim().toLowerCase(); if(s)pos.push(s);}
  }
  return {pos,neg};
}
function fieldHay(r,field){
  if(field==="title")return (r.title||"").toLowerCase();
  if(field==="scripture")return (r.scriptures||[]).join(" ").toLowerCase();
  if(field==="series")return (r.series||"").toLowerCase();
  if(field==="speaker")return (r.speaker||"").toLowerCase();
  return r._hay;
}
function match(r,f){
  if(!f.showdup && r.is_dup) return false;
  if(f.jh && !r.is_jianhui) return false;
  if(f.cc && !r.is_chuanchen) return false;
  if(f.scripture){const sc=f.scripture.toLowerCase(); const j=(r.scriptures||[]).join(" ").toLowerCase(); if(!j.includes(sc) && !(r.title||"").toLowerCase().includes(sc)) return false;}
  if(f.version && !(r.version_tag||"").toLowerCase().includes(f.version.toLowerCase())) return false;
  if(state.series){const s=state.series.toLowerCase(); if(!(r.series||'').toLowerCase().includes(s) && !r._hay.includes(s)) return false;}
  if(f.durMin!=null||f.durMax!=null){const d=r.duration; if(d==null)return false; if(f.durMin!=null&&d<f.durMin*60)return false; if(f.durMax!=null&&d>f.durMax*60)return false;}
  if(f.dateFrom||f.dateTo){const ud=r.upload_date||""; if(!ud)return false; if(f.dateFrom&&ud<f.dateFrom)return false; if(f.dateTo&&ud>f.dateTo)return false;}
  if(f.epMin!=null||f.epMax!=null){const en=r.episode_num; if(en==null)return false; if(f.epMin!=null&&en<f.epMin)return false; if(f.epMax!=null&&en>f.epMax)return false;}
  return true;
}
function score(r,field,pos,neg){
  const hay=fieldHay(r,field);
  for(const n of neg){if(hay.includes(n))return -1;}
  if(!pos.length)return 0;
  const title=(r.title||"").toLowerCase(); let sc=0;
  for(const p of pos){const c=hay.split(p).length-1; if(c===0)return -1; sc+=c; if(field==="all"){if(title.includes(p))sc+=2; if((r.series||"").toLowerCase().includes(p))sc+=3;}}
  return sc;
}
function curFilter(){
  return {jh:state.speaker==="jh",cc:state.speaker==="cc",showdup:$("#showdup").checked,
    scripture:$("#scripture").value.trim(),version:$("#version").value,
    durMin:num($("#durMin").value),durMax:num($("#durMax").value),
    dateFrom:digits($("#dateFrom").value),dateTo:digits($("#dateTo").value),
    epMin:num($("#epMin").value),epMax:num($("#epMax").value)};
}
function runSearch(){
  const f=curFilter(); const field=$("#field").value; const {pos,neg}=parseQuery($("#q").value);
  let sort=$("#sort").value;
  if(sort==="smart") sort = pos.length ? "relevance" : "date_desc";  // 瀏覽→最新在前；搜尋→最相關
  let pool=[];
  for(const r of ROWS){ if(!match(r,f))continue; const sc=score(r,field,pos,neg); if(sc<0)continue; pool.push([sc,r]); }
  let rows;
  if(pos.length && sort==="relevance"){ pool.sort((a,b)=>b[0]-a[0]); rows=pool.map(p=>p[1]); }
  else{
    rows=pool.map(p=>p[1]);
    if(sort==="duration") rows.sort((a,b)=>(b.duration||0)-(a.duration||0));
    else if(sort==="date") rows.sort((a,b)=>((a.upload_date?0:1)-(b.upload_date?0:1))||((a.upload_date||"")<(b.upload_date||"")?-1:1));
    else if(sort==="date_desc") rows.sort((a,b)=>((a.upload_date?0:1)-(b.upload_date?0:1))||(negDate(a.upload_date)<negDate(b.upload_date)?-1:1));
    else rows.sort((a,b)=>((a.series||"")<(b.series||"")?-1:1)||((a.episode_num||0)-(b.episode_num||0)));
  }
  return rows;
}
function card(r){
  const chips=[];
  if(r.is_jianhui) chips.push('<span class="chip jh">見輝法師</span>');
  if(r.is_chuanchen) chips.push('<span class="chip cc">傳塵和尚</span>');
  if(!r.is_jianhui && !r.is_chuanchen && r.speaker) chips.push(`<span class="chip">${esc(r.speaker)}</span>`);
  if(r.series) chips.push(`<span class="chip">${esc(r.series)}</span>`);
  if(r.version_tag) chips.push(`<span class="chip">${esc(r.version_tag)}</span>`);
  const info=[fmtDate(r.upload_date),"長度 "+(r.duration_string||"?")].filter(Boolean).join("　｜　");
  return `<div class="card"><div class="title">${esc(r.title)}</div>
    <div class="chips">${chips.join("")}</div>
    <div class="info">${esc(info)}</div>
    <a class="watch" href="${esc(r.url)}" target="_blank" rel="noopener">▶ 觀看影片</a></div>`;
}
function render(){
  const rows=runSearch();
  const total=rows.length, page=rows.slice(state.offset,state.offset+state.limit);
  $("#status").textContent = total ? `找到 ${total.toLocaleString()} 部影片` : "";
  // chosen-topic chip
  $("#chosenWrap").innerHTML = state.series ? `<button class="chosen" id="clrTopic">主題：${esc(state.series)}　✕ 清除</button>` : "";
  if($("#clrTopic")) $("#clrTopic").onclick=()=>{ state.series=""; state.offset=0; renderTopics(); render(); };
  $("#results").innerHTML = page.length ? page.map(card).join("") :
    '<div class="empty">沒有找到影片。<br>試試上面的「主題」按鈕，或換個字。</div>';
  const pg=$("#pager"); pg.innerHTML="";
  if(total>state.limit){
    const prev=document.createElement("button"); prev.textContent="← 上一頁"; prev.disabled=state.offset<=0;
    prev.onclick=()=>{state.offset=Math.max(0,state.offset-state.limit);render();scrollTop();};
    const next=document.createElement("button"); next.textContent="下一頁 →"; next.disabled=state.offset+page.length>=total;
    next.onclick=()=>{state.offset+=state.limit;render();scrollTop();};
    pg.appendChild(prev); pg.appendChild(next);
  }
  $("#toTop").style.display = total>state.limit ? "block" : "none";
}
function scrollTop(){ window.scrollTo({top:0,behavior:"smooth"}); }

function seriesCounts(){
  const f=curFilter(); const counts={};
  for(const r of ROWS){
    if(!f.showdup&&r.is_dup)continue;
    if(f.jh&&!r.is_jianhui)continue; if(f.cc&&!r.is_chuanchen)continue;
    const s=r.series; if(!s)continue; counts[s]=(counts[s]||0)+1;
  }
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}
const PINNED=["秒懂楞嚴","華嚴200問","觀心一支香","楞嚴禪七","雲端華嚴","大哉問"];
function renderTopics(){
  const items=seriesCounts();
  const cmap={}; items.forEach(([s,n])=>cmap[s]=n);
  let top=PINNED.filter(s=>cmap[s]>0).map(s=>[s,cmap[s]]);   // 固定六個主題
  for(const [s,n] of items){ if(top.length>=6) break; if(!PINNED.includes(s)) top.push([s,n]); }
  top=top.slice(0,6);
  const el=$("#topics");
  el.innerHTML = `<div class="topic ${state.series===''?'on':''}" data-s="">全部影片</div>` +
    top.map(([s,n])=>`<div class="topic ${state.series===s?'on':''}" data-s="${esc(s)}">${esc(s)}<span class="n">${n} 部</span></div>`).join("");
  el.querySelectorAll(".topic").forEach(t=>t.onclick=()=>{ state.series=t.dataset.s; state.offset=0; renderTopics(); render(); scrollTop(); });
  const all=$("#allTopics");
  all.innerHTML = items.map(([s,n])=>`<a data-s="${esc(s)}">${esc(s)}<span class="n">${n} 部</span></a>`).join("");
  all.querySelectorAll("a").forEach(a=>a.onclick=()=>{ state.series=a.dataset.s; state.offset=0; all.style.display="none"; $("#moreTopics").textContent="看全部主題 ▾"; renderTopics(); render(); scrollTop(); });
}
function setSpeaker(v){
  state.speaker=v; state.offset=0;
  $("#spk").querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.spk===v));
  renderTopics(); render();
}

$("#goBtn").onclick=()=>{state.offset=0;render();scrollTop();};
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){state.offset=0;render();scrollTop();}});
$("#spk").querySelectorAll("button").forEach(b=>b.onclick=()=>setSpeaker(b.dataset.spk));
$("#moreTopics").onclick=()=>{const a=$("#allTopics");const open=a.style.display==="none";a.style.display=open?"block":"none";$("#moreTopics").textContent=open?"收合主題 ▲":"看全部主題 ▾";};
$("#advToggle").onclick=()=>{const p=$("#advPanel");const open=p.style.display==="none";p.style.display=open?"block":"none";};
["scripture","version","durMin","durMax","dateFrom","dateTo","epMin","epMax","field","sort","showdup"].forEach(id=>{
  const el=$("#"+id); el.addEventListener("change",()=>{state.offset=0;renderTopics();render();});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"){state.offset=0;render();}});
});
$("#toTop").onclick=scrollTop;
$("#prov").textContent=PROV;
renderTopics(); render();
</script>
</body>
</html>
